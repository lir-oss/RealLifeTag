name: Build iOS (KMP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin iOS Framework
        id: compile
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace --no-daemon 2>&1 | tee build.log
        continue-on-error: true

      - name: Display Compiler Errors in Summary
        if: always()
        run: |
          echo "## Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            grep -E "(e:|error:|FAILURE|Exception|Compilation failed)" -B 2 -A 6 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Build Xcode Project
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -destination "generic/platform=iOS Simulator" -configuration Debug build CODE_SIGNING_ALLOWED=NO -derivedDataPath build

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: |
            iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
            composeApp/build/bin/iosSimulatorArm64/debugFramework/
            build.log
          if-no-files-found: ignore
